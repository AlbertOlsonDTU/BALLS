<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ballz Chaos Lab · Line clears</title>
<meta name="description" content="A Ballz-style brick breaker where the balls collide with each other.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
html,body{margin:0}
/* Layout: an arcade cabinet (the field) beside a tuning bench; the bench drops below on phones. Single committed dark look. */
:root{
  --bg:#1b1524; --field:#120e19; --dot:#2d2439; --panel:#231b2e; --line:#3a2e49;
  --fg:#f1e8f6; --muted:#a898b8; --ink:#1a1222;
  --amber:#f2b33d; --cream:#fbf1dc; --mint:#6fe3b4; --cyan:#68d3f2; --blast:#ff7a33; --rose:#e2577f;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{
  font-family:var(--display); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 40px;
}
*{box-sizing:border-box}
.app{max-width:1060px;margin:0 auto;display:grid;gap:28px;grid-template-columns:minmax(0,1fr);justify-items:center}

.cab{width:min(100%, max(270px, calc((100vh - 170px) * 0.6)));display:flex;flex-direction:column;gap:12px;min-width:0}
@supports (height:100dvh){.cab{width:min(100%, max(270px, calc((100dvh - 170px) * 0.6)))}}
.bar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:23px;font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0;text-wrap:balance}
.tag{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg);font-weight:500;font-size:17px}

.stage{position:relative;width:100%;aspect-ratio:3/5;max-width:100%;border-radius:14px;overflow:hidden;background:var(--field);box-shadow:0 0 0 1px var(--line), 0 18px 40px -20px #000}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:color-mix(in srgb, var(--field) 82%, transparent);padding:24px}
.firebtn{position:absolute;bottom:14px;right:14px;display:flex;align-items:baseline;gap:8px;font:inherit;font-size:16px;font-weight:800;letter-spacing:.01em;color:var(--ink);background:var(--amber);border:0;border-radius:999px;padding:11px 18px 11px 20px;cursor:pointer;box-shadow:0 6px 18px -6px #000, 0 0 0 3px color-mix(in srgb, var(--amber) 30%, transparent);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.firebtn.left{right:auto;left:14px}
.firebtn .n{font-family:var(--mono);font-size:12px;font-weight:500;opacity:.75}
.firebtn.paused{background:var(--fg)}
.firebtn.on{background:var(--rose);color:var(--fg)}
.firebtn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.over h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-0.02em}
.over p{margin:0 0 6px;color:var(--muted)}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.btn:focus-visible,.seg label:focus-within,input[type=range]:focus-visible,input[type=checkbox]:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ff{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.ff button{font:inherit;font-family:var(--mono);font-size:13px;color:var(--muted);background:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.ff button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.spacer{flex:1}

.sw{width:18px;height:18px;display:block}
.draft{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 16px;background:color-mix(in srgb, var(--field) 90%, transparent);overflow-y:auto}
.draft .kick{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
.draft h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.02em}
.cards{display:grid;gap:8px;width:100%;max-width:320px}
.card{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;min-height:66px}
.card:hover:not(:disabled),.card:focus-visible{border-color:var(--mint);outline:none}
.card:disabled{cursor:default}
.card .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15.5px;font-weight:800}
.card .ds{font-size:12.5px;color:var(--muted);line-height:1.35}
.card .tg{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.card .tg.b-raw{color:var(--amber)}
.card .tg.b-explosive{color:var(--blast)}
.card .tg.b-collision{color:var(--cyan)}
.card .tg.b-defense{color:var(--mint)}
.card.spinning{border-style:dashed}
.card.spinning .nm{color:var(--muted)}
.card.spinning .ds{filter:blur(2.5px);opacity:.6}
.card.landed{animation:land .34s cubic-bezier(.2,1.7,.4,1)}
@keyframes land{0%{transform:scale(.93);border-color:var(--amber)}55%{transform:scale(1.035);border-color:var(--amber)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.card.landed{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}
.chip{font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:inline-flex;gap:5px;align-items:baseline}
.chip b{font-family:var(--mono);font-weight:500;font-size:11.5px;color:var(--mint)}
.chips .none{font-size:12.5px;color:var(--muted)}
/* closed alpha: players see only the leaderboard and field guide; .adm is the admin's bench */
[hidden]{display:none!important}
.over .lbnote{font-size:13px;color:var(--mint);max-width:30ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.bestline{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.bestline b{color:var(--fg);font-weight:500}
</style>
</head>
<body>
<div class="app">
  <div class="cab">
    <header class="bar">
      <div>
        <h1>Ballz Chaos Lab</h1>
        <span class="tag">Line clears</span>
      </div>
      <div class="stats" aria-live="polite">
        <span>Round <b id="hudRound">1</b></span>
        <span><b id="hudBalls">8</b> balls</span>
        <span>Box HP <b id="hudHp">3</b></span>
        <span id="hudSuperWrap">Super <b id="hudSuper">r10</b></span>
        <span>Full clears <b id="hudClears">0</b></span>
        <span id="hudComboWrap">Best combo <b id="hudCombo">–</b></span>
      </div>
    </header>
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Game field. Drag upward to aim, release to fire."></canvas>
      <button class="firebtn" id="fireBtn" type="button" hidden><span class="t">Fire</span><span class="n"></span></button>
      <div class="draft" id="draft" hidden>
        <p class="kick" id="draftKick">Full clear</p>
        <h2 id="draftTitle">Pick a powerup</h2>
        <div class="cards" id="cards"></div>
      </div>
      <div class="over" id="over" hidden>
        <h2>Out of balls</h2>
        <p id="overText">You made it to round 1.</p>
        <p class="lbnote" id="overBest"></p>
        <button class="btn primary" id="overRestart" type="button">Play again</button>
      </div>
    </div>
    <div class="controls">
      <div class="ff" role="group" aria-label="Simulation speed">
        <button type="button" data-mult="1" aria-pressed="true">×1</button>
        <button type="button" data-mult="2" aria-pressed="false">×2</button>
        <button type="button" data-mult="4" aria-pressed="false">×4</button>
      </div>
      <button class="btn" id="recall" type="button">Recall balls</button>
      <span class="spacer"></span>
      <button class="btn" id="restart" type="button">Restart</button>
    </div>
    <div class="controls">
      <button class="btn" id="replayBtn" type="button" disabled>Replay last shot</button>
    </div>
    <div class="chips" id="chips" hidden></div>
    <p class="bestline" id="bestLine"></p>
  </div>

</div>
<script>
(() => {
"use strict";
// ---------- seeded randomness ----------
// Everything that changes the game (block layouts, explosions, pickups, powerup rolls) draws from this
// generator; it is re-seeded at every shot, so a replay of the shot plays out identically.
let rngState = 1;
const rngSeed = v => { rngState = (v >>> 0) || 1; };
function rng() {
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
// ---------- constants ----------
const C = 50, COLS = 9, ROWS = 14, W = C * COLS, H = ROWS * C + 50;
let R = 9, LAUNCH_Y = H - R - 2, STEP = 1 / 240, CS = 2 * R, GW = 1, GH = 1;
const GAP = 2.5, PR = 10;
// 13 positions above the line: 0 = open lane, then three stacked 4-row blocks (1–4 newest, 5–8, 9–12 oldest).
// Boxes shifted onto row 13 or below leave the field and cost balls equal to their remaining HP.
let BLOCK = 4; // rows per mini round; read from the slider whenever a new block is generated
const SNAP_T = 0.9, FLY_T = 0.6, GLOW_LINES = 0.9;
// round-end line animation: single lines play at 50% of the full length, rounds with a combo at 90%
const LINE_SINGLE = 0.5 * GLOW_LINES, LINE_COMBO = 0.9 * GLOW_LINES;
let lineDur = 0;
const linesMode = () => cfg.gameMode === "lines";
const DANGER_ROW = ROWS - 1, ADV = 0.35, GLOW = 0.6, GLOW_QUICK = 0.3, CLUTCH_T = 2.2, CLEAR_T = 0.85, WOMP_T = 2.8;
const MAXB = 6000, DRAIN_START = 12;
const MIN_ANGLE = 8 * Math.PI / 180;

// ---------- settings ----------
// The Line clears settings from the closed alpha's season 1, fixed for this page.
const DEF = { collide: "always", speedModel: "variable", speed: 1000, ballR: 9, fireRate: 4, startBalls: 3, plusChance: 0, splitChance: 0, splitSize: 2,
  blastChance: 15, triShare: 20, hpScale: 0.5, holes: 5, penalty: 1, blockRows: 3, drain: false, aimMode: "volley", hitFlash: true, forecast: true,
  slowmo: true, bombInterior: 2.5, blastR: 160, blastPush: 2.1, blastDmg: 100, bigShare: 100, bigRadius: 1.7, slowDepth: 38, slowHold: 0.12,
  slowRecover: 0.65, shakeAmt: 0.5, flashAmt: 0.3, hpExp: 1.1, hpPivot: 10, volleyMax: 0, fullClearPct: 0, fullClearPick: true, startPick: true,
  powerups: false, chapterLen: 10, budgetMin: 2, budgetMax: 4, newShare: 39, unlockAll: false, soloBoost: true, soloDelay: 1, soloRamp: 0.75, soloMax: 4,
  startRound: 1, jumpBalls: 1, slow_ballbox: false, slow_bomb: true, slow_blackhole: true, slow_missile: true, slow_magnet: true, slow_super: true,
  afterClearTwo: true, on_ballbox: true, ballboxKeep: false, on_bomb: true, on_blackhole: true, on_missile: true, on_portal: true, on_magnet: true,
  bhRadius: 130, bhPull: 0.7, bhHp: 0.5, bhLose: false, missileRotate: true, magRadius: 110, magStrength: 2400, magClash: true, gameMode: "lines",
  rowString: true, rowLast: true, rowCounter: false, rowSnap: true, lineReward: true, bigScore: true, superEvery: 10, superHp: 5, startLowerKeep: 30,
  hpMin: 1, perfOverlay: true };
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
let cfg = Object.assign({}, DEF);
const save = () => {};
// powerup stacks owned this run (id -> count); P(id) reads one
const pw = {};
const P = id => pw[id] || 0;

// ---------- ball storage (struct of arrays) ----------
const px = new Float32Array(MAXB), py = new Float32Array(MAXB), vx = new Float32Array(MAXB), vy = new Float32Array(MAXB);
const temp = new Uint8Array(MAXB), armed = new Uint8Array(MAXB), ret = new Uint8Array(MAXB);
const age = new Float32Array(MAXB); // seconds in flight, drives the drain
const charged = new Uint8Array(MAXB); // Momentum: set by a ball–ball hit, spent on the next box hit
const held = new Int32Array(MAXB);    // id of the black hole holding this ball (0 = free)
const eaten = new Uint8Array(MAXB);   // swallowed by a black hole this round
const pcd = new Float32Array(MAXB);   // portal cooldown, so a ball can't bounce straight back through
let nB = 0;
let head = new Int32Array(1);
const nxt = new Int32Array(MAXB), cellOf = new Int32Array(MAXB);
// Ball size drives the launch line, the ball-grid cell size and the substep length
// (each substep moves a ball at most 0.6 radii, so fast small balls can't tunnel).
function applyGeometry() {
  R = cfg.ballR; LAUNCH_Y = H - R - 2;
  CS = 2 * R; GW = Math.ceil(W / CS); GH = Math.ceil(H / CS);
  head = new Int32Array(GW * GH);
  STEP = Math.min(1 / 240, 0.6 * R / (cfg.speed * 1.8));
}
applyGeometry();

function spawn(x, y, ux, uy, isTemp, isArmed) {
  if (nB >= MAXB) return;
  px[nB] = x; py[nB] = y; vx[nB] = ux; vy[nB] = uy;
  temp[nB] = isTemp; armed[nB] = isArmed; ret[nB] = 0; age[nB] = 0; charged[nB] = 0; held[nB] = 0; pcd[nB] = 0; eaten[nB] = 0; nB++;
}
function removeAt(i) {
  const l = nB - 1;
  if (i !== l) { px[i] = px[l]; py[i] = py[l]; vx[i] = vx[l]; vy[i] = vy[l]; temp[i] = temp[l]; armed[i] = armed[l]; ret[i] = ret[l]; age[i] = age[l]; charged[i] = charged[l]; held[i] = held[l]; pcd[i] = pcd[l]; eaten[i] = eaten[l]; }
  nB--;
}

// ---------- world ----------
let shapes = [], pickups = [];
const grid = new Array(ROWS * COLS).fill(null), pickGrid = new Array(ROWS * COLS).fill(null);
let phase = "aim", round = 1, ballCount = 8, launchX = W / 2, toLaunch = 0, launchTimer = 0, launchGap = 0.05;
let dirX = 0, dirY = -1, roundTime = 0, gained = 0, firstReturnX = null, simMult = 1, advanceT = 0, hasFired = false;
let anyDead = false, anyPicked = false;
const blastQueue = [];
// Explosion feel: time dips to 12% for a beat, then eases back to full speed; chains re-trigger it.
const slowDur = () => cfg.slowHold + cfg.slowRecover;
let slowT = 0, shake = 0, flashA = 0, shX = 0, shY = 0;
// Every special block pop uses the same slow-mo dip (depth, hold, ease back), plus shake and flash scaled
// per type. Each type can be switched on or off; chained pops restart the dip.
const POP_FX = {   // [shake, flash, settings key]
  ballbox: [0.2, 0.04, "slow_ballbox"], bomb: [0.75, 0.2, "slow_bomb"], bigbomb: [1.2, 0.32, "slow_bomb"],
  blackhole: [0.6, 0.12, "slow_blackhole"], missile: [0.45, 0.08, "slow_missile"], magnet: [0.85, 0.22, "slow_magnet"],
  superblock: [0.9, 0.25, "slow_super"],
};
function popFx(kind) {
  const [sh, fl, key] = POP_FX[kind];
  if (!cfg.slowmo || !cfg[key]) return false;
  slowT = slowDur();
  shake = Math.min(1.3 * cfg.shakeAmt * (kind === "bigbomb" ? 1.6 : 1), shake + sh * cfg.shakeAmt);
  flashA = Math.min(0.4 * cfg.flashAmt, flashA + fl * cfg.flashAmt);
  return true;
}
function timeScale() {
  if (!cfg.slowmo || slowT <= 0) return 1;
  const lo = cfg.slowDepth / 100, e = slowDur() - slowT;
  if (e < cfg.slowHold) return lo;
  const f = Math.min(1, (e - cfg.slowHold) / Math.max(0.01, cfg.slowRecover));
  return lo + (1 - lo) * f * f;
}
let particles = [], rings = [], sparks = [], zaps = [], toast = null, clutch = null, glowBands = [], glowT = 0;
// clears: which block is newest, plus the clear animation and a pending powerup pick
let blockSeq = 0, lastBlk = 0, lastBlkTop = 1, lastBlkRows = 4;
let clearT = 0, clearInfo = null, draftOpen = false, crushed = [], glowDur = GLOW, glowLabel = false;
// powerup picks waiting to open once the round's animations are done (one entry per pick, the label shown on it)
// line clears: snaps play where a row lost its last box; lineCombo counts clears this round for the callout
// lineRows: rows cleared this round (row, x of the last box, order) - shown faintly during the round,
// paid out and celebrated at round end together with the collapse
let lineRows = [];
let rowSnaps = [], lineCombo = 0, flyers = [], scoreShown = 0, scorePop = 0;
let clearedThisRound = false;   // the full clear already fired this round (from the last box's death)
let draftQueue = [], superFx = null, forceSuper = false, boomStamp = 0, ballStamp = 0;
// Superblock rounds: every Nth round's block carries a 3x3 superblock; popping it earns a powerup pick
// ---------- special blocks ----------
// Types unlock in this order, one per chapter: ball blocks from round 1, then one new type every chapterLen rounds.
const SPECIALS = ["ballbox", "bomb", "blackhole", "missile", "portal", "magnet"];
const SPEC_NAME = { ballbox: "Ball block", bomb: "Bomb", blackhole: "Black hole", missile: "Missile", portal: "Portal pair", magnet: "Magnet" };
const SPEC_DESC = {
  ballbox: "Releases an extra ball into play when destroyed.",
  bomb: "Explodes when destroyed, damaging its neighbours.",
  blackhole: "Fragile. When it breaks it eats the blocks touching it, and pulls in and destroys nearby balls.",
  missile: "Fires along its arrow when destroyed, wiping out every box in its path. The arrow turns each round.",
  portal: "Two linked rings. A ball entering one comes out of the other.",
  magnet: "Bends balls toward it (+) or away (−). Two magnets that touch explode.",
};
const SPEC_COST = { portal: 2 };
const unlockRound = t => { const k = SPECIALS.indexOf(t); return k <= 0 ? 1 : k * cfg.chapterLen; };
const unlockedAt = r => SPECIALS.filter(t => cfg["on_" + t] && (cfg.unlockAll || r >= unlockRound(t)));
let holes = [], missiles = [], ghosts = [], portals = [], holeSeq = 0, portalSeq = 0;
let runClears = 0, runCombo = 0;   // this run: full clears, longest run of connecting lines
let runStart = 1, introduced = new Set(), forceSpecial = null, newBanner = null, magnetCheck = false, clashFx = [];
// The block's special budget: a random count between budgetMin and budgetMax, each slot rolled as the newest
// unlocked type (newShare%) or one of the older types (the rest, split evenly). A portal pair costs 2.
// The first block after a type unlocks always contains it.
function planSpecials() {
  const types = unlockedAt(round);
  const out = [];
  let budget = randInt(cfg.budgetMin, Math.max(cfg.budgetMin, cfg.budgetMax));
  const cost = t => SPEC_COST[t] || 1;
  if (forceSpecial) { out.push(forceSpecial); budget -= cost(forceSpecial); forceSpecial = null; }
  const newest = types[types.length - 1];
  if (newest && newest !== SPECIALS[0] && !introduced.has(newest) && !cfg.unlockAll) {
    introduced.add(newest); out.push(newest); budget -= cost(newest);
    newBanner = { type: newest, t: 3.2 };
  }
  const older = types.slice(0, -1);
  while (budget > 0 && types.length) {
    let t = types.length === 1 || rng() * 100 < cfg.newShare ? newest : older[randInt(0, older.length - 1)];
    if (cost(t) > budget) { const cheap = types.filter(x => cost(x) <= budget); if (!cheap.length) break; t = cheap[randInt(0, cheap.length - 1)]; }
    out.push(t); budget -= cost(t);
  }
  if (types.includes("bomb") && rng() < 0.15 * P("bombs")) out.push("bomb");   // Powder keg
  return out;
}
const isSuperRound = r => cfg.powerups && cfg.superEvery > 0 && r % cfg.superEvery === 0;
const rowsOf = s => s.h || 1;             // superblocks span 3 rows and 3 columns
const bottomRow = s => s.row + rowsOf(s) - 1;
// per-round charges from powerups
const stats = { pairs: 0, hits: 0, steps: 0 };

// Box HP: the old straight line (round + 1) bent by the growth exponent around a pivot round.
// HP(r) = scale * (r+1) * ((r+1)/(pivot+1))^(exp-1): equal at the pivot, lower before, steeper after.
const hpAt = r => { const r1 = r + 1; return Math.max(cfg.hpMin, Math.round(cfg.hpScale * r1 * Math.pow(r1 / (cfg.hpPivot + 1), cfg.hpExp - 1))); };
const hpBase = () => hpAt(round);
// Piercing threshold: 2 HP or 10% of the box's starting HP, whichever is more; each extra stack adds
// 1 HP to the floor and 10 points to the percentage (2 stacks: 3 HP or 20%)
const pierceAt = s => Math.max(1 + P("pierce"), 0.1 * P("pierce") * s.maxHp);
// Critical hits: each ball hit has a 10% chance per stack to deal double damage
const critRoll = () => P("crit") > 0 && rng() < 0.1 * P("crit");
const penaltyMult = () => cfg.penalty;
const randInt = (a, b) => a + ((rng() * (b - a + 1)) | 0);
const clampCol = c => c < 0 ? 0 : (c > COLS - 1 ? COLS - 1 : c);

function geom(s) {
  s.x0 = s.col * C + GAP; s.y0 = s.row * C + GAP; s.x1 = (s.col + (s.w || 1)) * C - GAP; s.y1 = (s.row + (s.h || 1)) * C - GAP;
  if (s.kind === "tri") {

  // missiles: blinking origin during the wind-up, then a bright head with a streak
  for (const m of missiles) {
    ctx.save();
    if (m.t < MISSILE_WIND) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(m.t * 80); ctx.strokeStyle = "#eafff8"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + m.dx * 60, m.y + m.dy * 60); ctx.stroke();
    } else {
      ctx.lineCap = "round";
      for (let k = 1; k < m.trail.length; k++) {
        ctx.globalAlpha = k / m.trail.length; ctx.strokeStyle = "#9ff0e2"; ctx.lineWidth = 2 + 4 * k / m.trail.length;
        ctx.beginPath(); ctx.moveTo(m.trail[k - 1][0], m.trail[k - 1][1]); ctx.lineTo(m.trail[k][0], m.trail[k][1]); ctx.stroke();
      }
      ctx.globalAlpha = 1; ctx.shadowColor = "#9ff0e2"; ctx.shadowBlur = 16; ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(m.x, m.y, 5, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
  // blast rings: a hot core that fades fast, then the expanding shock ring
  for (const r of rings) {
    const f = r.t / 0.45;
    if (f < 0.4) {
      const g = 1 - f / 0.4;
      ctx.fillStyle = r.hole ? "rgba(185,163,255," + (0.3 * g).toFixed(3) + ")" : r.gold ? "rgba(255,226,140," + (0.45 * g).toFixed(3) + ")" : "rgba(255,190,110," + (0.38 * g).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.25 + 0.45 * f / 0.4), 0, 6.2832); ctx.fill();
    }
    ctx.strokeStyle = (r.hole ? "rgba(185,163,255," : r.gold ? "rgba(255,207,90," : "rgba(255,122,51,") + (1 - f).toFixed(3) + ")"; ctx.lineWidth = 3 * (1 - f) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.3 + 0.7 * f), 0, 6.2832); ctx.stroke();
  }
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1;

  if (superFx) {   // "SUPERBLOCK!" pop where it broke
    const age = 1.6 - superFx.t, pop = age < 0.2 ? 0.6 + 0.7 * (age / 0.2) : (age < 0.35 ? 1.3 - (age - 0.2) / 0.15 * 0.3 : 1);
    ctx.save(); ctx.globalAlpha = Math.min(1, superFx.t * 2);
    ctx.translate(W / 2, Math.min(Math.max(superFx.y, 90), H * 0.6)); ctx.rotate(-0.05); ctx.scale(pop, pop);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = "800 46px 'Bricolage Grotesque', system-ui, sans-serif";
    ctx.lineWidth = 8; ctx.strokeStyle = "#120e19"; ctx.strokeText("SUPERBLOCK!", 0, 0);
    ctx.shadowColor = "#ffcf5a"; ctx.shadowBlur = 26; ctx.fillStyle = "#ffe08a"; ctx.fillText("SUPERBLOCK!", 0, 0); ctx.shadowBlur = 0;
    ctx.font = "500 12.5px 'DM Mono', ui-monospace, monospace"; ctx.lineWidth = 5;
    ctx.strokeText("powerup pick after this round", 0, 34); ctx.fillStyle = "#fbf1dc"; ctx.fillText("powerup pick after this round", 0, 34);
    ctx.restore();
  }

  if (clutch) {
    const age = CLUTCH_T - clutch.t;
    const pop = age < 0.18 ? 0.6 + 0.6 * (age / 0.18) : (age < 0.3 ? 1.2 - (age - 0.18) / 0.12 * 0.2 : 1);
    ctx.save();
    ctx.globalAlpha = Math.min(1, clutch.t * 1.8);
    const pure = clutch.pure;
    ctx.translate(W / 2, H * 0.4); ctx.rotate(pure ? -0.06 : 0.04); ctx.scale(pop, pop);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const word = pure ? "CLUTCH!" : "SEMI-CLUTCH";
    ctx.font = "800 " + (pure ? 54 : 38) + "px 'Bricolage Grotesque', system-ui, sans-serif";
    ctx.lineJoin = "round"; ctx.lineWidth = 8; ctx.strokeStyle = "#120e19"; ctx.strokeText(word, 0, 0);
    if (pure) { ctx.shadowColor = "#f2b33d"; ctx.shadowBlur = 24; ctx.fillStyle = "#ffcf5a"; }
    else { ctx.shadowColor = "#68d3f2"; ctx.shadowBlur = 14; ctx.fillStyle = "#bfeaf7"; }
    ctx.fillText(word, 0, 0);
    ctx.shadowBlur = 0;
    ctx.font = "500 12px 'DM Mono', ui-monospace, monospace"; ctx.lineWidth = 5;
    const balls = n => n + " ball" + (n === 1 ? "" : "s");
    const sub = pure ? "row collapse saved " + balls(clutch.n) + " · no damage"
      : "saved " + balls(clutch.n) + " · still lost " + clutch.lost;
    const sy = pure ? 38 : 30;
    ctx.strokeText(sub, 0, sy); ctx.fillStyle = "#fbf1dc"; ctx.fillText(sub, 0, sy);
    ctx.restore();
  }

  if (toast) {
    ctx.globalAlpha = Math.min(1, toast.t * 1.5);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const ty = DANGER_ROW * C + 26 - (2.2 - toast.t) * 6;
    ctx.font = "800 22px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = toast.good ? "#6fe3b4" : "#e2577f";
    ctx.fillText(toast.text, W / 2, ty);
    ctx.font = "500 11px 'DM Mono', ui-monospace, monospace"; ctx.fillStyle = "#a898b8";
    ctx.fillText(toast.sub, W / 2, ty + 19);
    ctx.globalAlpha = 1;
  }

  // balls, batched by kind
  ctx.fillStyle = "#fbf1dc"; ctx.beginPath();
  for (let i = 0; i < nB; i++) if (!temp[i] && !charged[i]) { ctx.moveTo(px[i] + R, py[i]); ctx.arc(px[i], py[i], R, 0, 6.2832); }
  ctx.fill();
  ctx.fillStyle = "#ffd27a"; ctx.beginPath();   // Momentum: balls carrying a charge glow amber
  for (let i = 0; i < nB; i++) if (!temp[i] && charged[i]) { ctx.moveTo(px[i] + R, py[i]); ctx.arc(px[i], py[i], R, 0, 6.2832); }
  ctx.fill();
  if (soloMult > 1.05 && nB === 1) {   // last ball: a speed streak behind it and the current boost
    const sp = Math.hypot(vx[0], vy[0]) || 1, L = Math.min(70, 9 * (soloMult - 1) * R / 3 + 10);
    const g = ctx.createLinearGradient(px[0], py[0], px[0] - vx[0] / sp * L, py[0] - vy[0] / sp * L);
    g.addColorStop(0, "rgba(251,241,220,.55)"); g.addColorStop(1, "rgba(251,241,220,0)");
    ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = R * 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(px[0], py[0]); ctx.lineTo(px[0] - vx[0] / sp * L, py[0] - vy[0] / sp * L); ctx.stroke();
    ctx.font = "500 11px 'DM Mono', ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillStyle = "#a898b8"; ctx.fillText("LAST BALL ×" + soloMult.toFixed(1), 10, LAUNCH_Y + R);
    ctx.restore();
  }
  ctx.fillStyle = "#68d3f2"; ctx.beginPath();
  for (let i = 0; i < nB; i++) if (temp[i]) { ctx.moveTo(px[i] + R, py[i]); ctx.arc(px[i], py[i], R, 0, 6.2832); }
  ctx.fill();

  // launcher
  if (phase === "aim" || (phase === "run" && toLaunch > 0)) {
    ctx.fillStyle = "#fbf1dc"; ctx.beginPath(); ctx.arc(launchX, LAUNCH_Y, R, 0, 6.2832); ctx.fill();
    const n = phase === "aim" ? ballCount : toLaunch;
    ctx.font = "500 12px 'DM Mono', ui-monospace, monospace"; ctx.textBaseline = "middle";
    const right = launchX < W - 60;
    ctx.textAlign = right ? "left" : "right"; ctx.fillStyle = "#a898b8";
    ctx.fillText("×" + n, launchX + (right ? R + 6 : -R - 6), LAUNCH_Y - 1);
  }

  // aim preview
  const streaming = cfg.aimMode === "stream";
  const showStream = streaming && hasAim && !replaying && ((phase === "aim" && !animating()) || (phase === "run" && toLaunch > 0));
  if (showStream || (!streaming && aiming && phase === "aim")) {
    if (streaming || aimY < LAUNCH_Y - 14) {
      const a = streaming ? aimA : aimAngle(aimX, aimY);
      const dx = Math.cos(a), dy = Math.sin(a);
      ctx.save(); ctx.globalAlpha = streaming && !aiming ? 0.5 : 1; // the held aim dims when your finger is off
      // Multishot: faint cyan side lines where its free temporary balls would go (±0.1 rad, the same
      // angles the launcher uses), stronger with more stacks, labelled with the chance per launch
      const ms = P("multishot");
      if (ms > 0) {
        const base = Math.atan2(dy, dx), a0 = ctx.globalAlpha;
        ctx.fillStyle = "#68d3f2";
        for (const side of [-1, 1]) {
          let am = base + side * 0.1;
          if (am > -MIN_ANGLE) am = -MIN_ANGLE; if (am < -Math.PI + MIN_ANGLE) am = -Math.PI + MIN_ANGLE;
          const mx = Math.cos(am), my = Math.sin(am), hm = trace(launchX, LAUNCH_Y, mx, my, 1400);
          const Lm = Math.hypot(hm.x - launchX, hm.y - LAUNCH_Y);
          for (let d = 26; d < Lm; d += 14) {
            ctx.globalAlpha = a0 * (0.3 + 0.08 * ms) * (1 - 0.5 * d / Math.max(Lm, 1));
            ctx.beginPath(); ctx.arc(launchX + mx * d, LAUNCH_Y + my * d, 1.5, 0, 6.2832); ctx.fill();
          }
          if (side === 1 && Lm > 60) {   // chance label just past the launcher, on the right-hand line
            ctx.globalAlpha = a0 * 0.85;
            ctx.font = "500 10px 'DM Mono', ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillText(10 * ms + "%", launchX + mx * 52 + 8, LAUNCH_Y + my * 52);
          }
        }
        ctx.globalAlpha = a0;
      }
      // full segment to the first bounce, then a short fading stub
      ctx.fillStyle = "#fbf1dc"; ctx.strokeStyle = "#fbf1dc"; ctx.lineWidth = 1.5;
      const baseA = ctx.globalAlpha, full = 1;
      let sx = launchX, sy = LAUNCH_Y, ux = dx, uy = dy;
      for (let k = 0; k <= full; k++) {
        const stub = k === full, h = trace(sx, sy, ux, uy, stub ? 110 : 1400), L = Math.hypot(h.x - sx, h.y - sy);
        for (let d = k === 0 ? 18 : 10; d < L; d += 14) {
          ctx.globalAlpha = baseA * (stub ? 1 - d / 120 : 1 - 0.18 * k);
          ctx.beginPath(); ctx.arc(sx + ux * d, sy + uy * d, 2, 0, 6.2832); ctx.fill();
        }
        if (!h.hit || stub) break;
        ctx.globalAlpha = baseA * (1 - 0.18 * k);
        ctx.beginPath(); ctx.arc(h.x, h.y, R, 0, 6.2832); ctx.stroke();
        const vn = ux * h.nx + uy * h.ny; ux -= 2 * vn * h.nx; uy -= 2 * vn * h.ny; sx = h.x; sy = h.y;
      }
      ctx.globalAlpha = baseA;
      ctx.restore();
    }
  } else if (phase === "aim" && !hasFired && !animating() && !newBanner) {
    ctx.font = "600 14px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#a898b8";
    ctx.fillText(streaming ? "Drag to aim, then press Fire" : "Drag up to aim, release to fire", W / 2, LAUNCH_Y - 34);
  }

  // Big ball count in the top lane: your balls including ones earned this round, counting up as they
  // arrive. Flying "+n" chips from line clears land on it.
  const flying = flyers.filter(f => !f.done).reduce((a, f) => a + f.n, 0);
  const target = ballCount + gained - flying;
  scoreShown += (target - scoreShown) * 0.25; if (Math.abs(target - scoreShown) < 0.5) scoreShown = target;
  if (linesMode() && cfg.bigScore) {
    ctx.save();
    const sc = 1 + 0.25 * scorePop;
    ctx.translate(W / 2, 22); ctx.scale(sc, sc);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = "800 34px 'Bricolage Grotesque', system-ui, sans-serif";
    ctx.globalAlpha = 0.95; ctx.lineWidth = 6; ctx.strokeStyle = "#120e19";
    const txt = String(Math.round(scoreShown));
    ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = scorePop > 0 ? "#ffe08a" : "#fbf1dc"; ctx.fillText(txt, 0, 0);
    ctx.font = "500 8.5px 'DM Mono', ui-monospace, monospace"; ctx.globalAlpha = 0.7; ctx.fillStyle = "#a898b8";
    ctx.fillText("BALLS", 0, 21);
    ctx.restore();
  }
  for (const f of flyers) {
    if (f.done) continue;
    const e = Math.min(1, f.t / FLY_T), q = e * e * (3 - 2 * e);
    const fx = f.x + (W / 2 - f.x) * q, fy = f.y + (22 - f.y) * q - Math.sin(e * Math.PI) * 30;
    ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * (1 - e);
    ctx.font = "800 15px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = 4; ctx.strokeStyle = "#120e19"; ctx.strokeText("+" + f.n, fx, fy);
    ctx.fillStyle = "#ffe08a"; ctx.fillText("+" + f.n, fx, fy);
    ctx.restore();
  }

  if (replaying) {   // REPLAY badge, top right
    ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 220);
    ctx.font = "500 11px 'DM Mono', ui-monospace, monospace"; ctx.textAlign = "right"; ctx.textBaseline = "top";
    rrect(W - 74, 8, 66, 18, 5); ctx.fillStyle = "rgba(226,87,127,.85)"; ctx.fill();
    ctx.fillStyle = "#fff1f1"; ctx.fillText("● REPLAY", W - 12, 12);
    ctx.restore();
  }
  if (newBanner && !animating()) {   // a type has just unlocked: name it once, under the field's middle
    const b = newBanner, a = Math.min(1, b.t * 1.5, (3.2 - b.t) * 5), y = DANGER_ROW * C + 30;
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.font = "500 10.5px 'DM Mono', ui-monospace, monospace"; ctx.fillStyle = "#68d3f2"; ctx.fillText("NEW BLOCK", W / 2, y - 20);
    ctx.font = "800 24px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.lineWidth = 6; ctx.strokeStyle = "#120e19";
    ctx.strokeText(SPEC_NAME[b.type], W / 2, y); ctx.fillStyle = "#fbf1dc"; ctx.fillText(SPEC_NAME[b.type], W / 2, y);
    ctx.font = "500 11.5px 'Bricolage Grotesque', system-ui, sans-serif"; ctx.fillStyle = "#cfc2dc";
    const words = SPEC_DESC[b.type].split(" "); let line = "", ly = y + 22;
    for (const w of words) { if (ctx.measureText(line + w).width > W - 60) { ctx.fillText(line.trim(), W / 2, ly); line = ""; ly += 15; } line += w + " "; }
    ctx.fillText(line.trim(), W / 2, ly);
    ctx.restore();
  }

  if (flashA > 0) { ctx.fillStyle = "rgba(255,214,160," + flashA.toFixed(3) + ")"; ctx.fillRect(-10, -10, W + 20, H + 20); }

  if (cfg.perfOverlay) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.font = "500 10.5px 'DM Mono', ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    const l1 = Math.round(fpsE) + " fps · phys " + msE.toFixed(2) + " ms";
    const l2 = nB + " balls · " + Math.round(pairsE) + " pair checks";
    ctx.fillStyle = "rgba(18,14,25,.75)"; ctx.fillRect(4, 4, Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + 10, 30);
    ctx.fillStyle = "#6fe3b4"; ctx.fillText(l1, 9, 8); ctx.fillText(l2, 9, 20);
  }
}

// ---------- HUD / UI ----------
function $(id) { return document.getElementById(id); }
function updateHud() {
  $("hudRound").textContent = round;
  $("hudBalls").textContent = ballCount + (gained ? " +" + gained : "");
  $("hudHp").textContent = hpBase();
  const live = shapes.some(s => s.super && !s.dead);
  $("hudSuper").textContent = live ? "on field" : cfg.superEvery > 0 ? "r" + (Math.ceil((round + 1) / cfg.superEvery) * cfg.superEvery) : "off";
  $("hudSuperWrap").hidden = !cfg.powerups;
  $("hudClears").textContent = runClears;
  $("hudCombo").textContent = runCombo >= 2 ? (["", "", "Double", "Triple", "Quad"][runCombo] || runCombo + " lines") : "–";
  $("hudComboWrap").hidden = !linesMode();
}

// ---------- powerups ----------
// Every powerup is tuned to roughly a 10% gain per stack. build: which strategy it feeds (shown on pick cards).
const POWERS = [
  // raw damage
  { id: "balls", build: "Raw", name: "Ball surge", desc: "+10% balls, right now (rounded up).", max: 5, pick() { ballCount = Math.ceil(ballCount * 1.1); } },
  { id: "crit", build: "Raw", name: "Critical hits", desc: "Each ball hit has a 10% chance to deal double damage.", max: 5 },
  { id: "pierce", build: "Raw", name: "Piercing", desc: "Balls smash straight through boxes with 2 HP or 10% of their starting HP left, whichever is more (+1 HP and +10% per stack).", max: 5 },
  { id: "multishot", build: "Raw", name: "Multishot", desc: "Each launch has a 10% chance to also fire a free temporary ball.", max: 5 },
  { id: "plus", build: "Raw", name: "Harvest", desc: "+1 ball pickups appear 25% more often.", max: 5 },
  // explosive
  { id: "bombs", build: "Explosive", name: "Powder keg", desc: "15% chance per block of one extra bomb, on top of the special budget.", max: 5 },
  { id: "bigblast", build: "Explosive", name: "Bigger blasts", desc: "+10 percentage points to the chance an explosive is a big 5×5 one.", max: 5 },
  { id: "shrapnel", build: "Explosive", name: "Shrapnel", desc: "Every explosion throws out 1 temporary ball (+1 per stack, and 1 more from big ones).", max: 5 },
  // collision
  { id: "static", build: "Collision", name: "Static charge", desc: "Each ball–ball hit has a 15% chance to zap the nearest box for 1 damage.", max: 5 },
  { id: "momentum", build: "Collision", name: "Momentum", desc: "After a ball–ball hit, that ball's next box hit deals +50% damage. Charged balls glow amber.", max: 5 },
  { id: "splits", build: "Collision", name: "Splitter", desc: "Split pickups appear 30% more often.", max: 5 },
  // defense
  { id: "shield", build: "Defense", name: "Shield", desc: "Blocks the next leftover penalty completely. Used up when it triggers.", max: 99 },
  { id: "compactor", build: "Defense", name: "Compactor", desc: "Every 3rd round the lowest box on the field is crushed (every 2nd with two stacks, every round with three).", max: 3 },
];
const POWER = Object.fromEntries(POWERS.map(p => [p.id, p]));
function grant(id) {
  const d = POWER[id]; if (!d || P(id) >= d.max) return;
  pw[id] = P(id) + 1;
  if (d.pick) d.pick();
  renderChips(); updateHud();
}
function renderChips() {
  const owned = POWERS.filter(p => P(p.id) > 0);
  $("chips").innerHTML = owned.length
    ? owned.map(p => '<span class="chip">' + p.name + "<b>×" + P(p.id) + "</b></span>").join("")
    : '<span class="none">No powerups yet. Pop a superblock to pick one.</span>';
}
// pick 1 of 3: rare powerups weigh 1, the rest 3; maxed-out ones are left out
// The pick screen: 5 distinct offers. Each card flickers through random powerups like a slot reel,
// then the reels stop one after another (left to right in time) on the real offers. Cards can only
// be chosen once every reel has stopped. With reduced motion the offers appear at once.
const DRAFT_SIZE = 5;
let spinTimer = null;
function cardInner(p) {
  const tags = [p.build ? p.build.toUpperCase() : "", P(p.id) ? "have ×" + P(p.id) : ""].filter(Boolean).join(" · ");
  return '<span class="nm">' + p.name + '<span class="tg' + (p.build ? " b-" + p.build.toLowerCase() : "") + '">' + tags + "</span></span>"
    + '<span class="ds">' + p.desc + "</span>";
}
function openDraft(kicker = "Full clear") {
  $("draftKick").textContent = kicker;
  const pool = POWERS.filter(p => P(p.id) < p.max), picks = [];
  const reel = pool.slice();   // what the spinning cards flicker through
  while (picks.length < DRAFT_SIZE && pool.length) {
    const total = pool.reduce((a, p) => a + (p.rare ? 1 : 3), 0);
    let r = Math.random() * total, k = 0;
    for (; k < pool.length - 1; k++) { r -= pool[k].rare ? 1 : 3; if (r <= 0) break; }
    picks.push(pool.splice(k, 1)[0]);
  }
  if (!picks.length) return;
  $("cards").innerHTML = picks.map(() => '<button class="card spinning" type="button" disabled></button>').join("");
  $("draft").hidden = false; draftOpen = true;
  const cards = [...$("cards").querySelectorAll(".card")];
  const land = (el, p) => {
    el.innerHTML = cardInner(p); el.dataset.pick = p.id;
    el.classList.remove("spinning"); el.classList.add("landed");
  };
  const finish = () => {   // every reel has stopped: unlock all cards together
    cards.forEach(el => { el.disabled = false; });
    $("draftTitle").textContent = "Pick a powerup";
    if (cards[0]) try { cards[0].focus({ preventScroll: true }); } catch (_) {}
  };
  clearTimeout(spinTimer);
  if (reduced || !cards.length) { cards.forEach((el, k) => land(el, picks[k])); finish(); return; }
  $("draftTitle").textContent = "Rolling…";
  const start = performance.now(), stopAt = picks.map((_, k) => 650 + k * 280);
  const tick = () => {
    const t = performance.now() - start; let left = 0;
    cards.forEach((el, k) => {
      if (el.dataset.pick) return;
      if (t >= stopAt[k]) { land(el, picks[k]); return; }
      left++;
      el.innerHTML = cardInner(reel[(Math.random() * reel.length) | 0]);
    });
    if (left) spinTimer = setTimeout(tick, 70); else finish();
  };
  tick();
}
function closeDraft() { clearTimeout(spinTimer); $("draft").hidden = true; draftOpen = false; }
$("cards").addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if (!b) return; grant(b.dataset.pick); closeDraft(); updateHud(); });
let fpsE = 60, msE = 0, pairsE = 0, hitsE = 0, stepsE = 0, lastPanel = 0;
function updatePanel() {}
function syncUI() { applyGeometry(); updateHud(); }
$("restart").addEventListener("click", newGame);
$("overRestart").addEventListener("click", newGame);

// ---------- main loop ----------
let last = performance.now(), acc = 0;
// Last ball: once every ball has launched and only one is left, it speeds up after soloDelay seconds,
// gaining soloRamp × per second up to soloMax ×. Done by running its simulation faster, which keeps its
// path exactly the same (and replays exact) while it covers ground quicker.
let soloT = 0, soloMult = 1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) fpsE += (1 / dt - fpsE) * 0.08;
  stats.pairs = 0; stats.hits = 0; stats.steps = 0;
  const t0 = performance.now();
  if (phase === "run") {
    const solo = cfg.soloBoost && toLaunch === 0 && nB === 1 && !held[0];
    soloT = solo ? soloT + dt : 0;
    soloMult = solo ? Math.min(cfg.soloMax, 1 + cfg.soloRamp * Math.max(0, soloT - cfg.soloDelay)) : 1;
    acc += dt * simMult * timeScale() * soloMult;
    const cap = Math.ceil(0.05 / STEP * simMult * soloMult) + 1; let n = 0;
    while (acc >= STEP && n < cap) { step(); acc -= STEP; n++; }
    if (n >= cap) acc = 0;
    if (toLaunch === 0 && nB === 0 && !missiles.length && !holes.some(h => h.phase === "pull")) endRound();
  } else { soloT = 0; soloMult = 1; }
  msE += (performance.now() - t0 - msE) * 0.1;
  pairsE += (stats.pairs - pairsE) * 0.1; hitsE += (stats.hits - hitsE) * 0.1; stepsE += (stats.steps - stepsE) * 0.1;
  // after a round: clear sweep, then collapse glow, then the slide; the powerup pick opens last
  if (clearT > 0) clearT = Math.max(0, clearT - dt);
  else if (glowT > 0) glowT = Math.max(0, glowT - dt);
  else if (advanceT > 0) advanceT = Math.max(0, advanceT - dt);
  if (magnetCheck && !animating() && phase === "aim") { magnetCheck = false; magnetClash(); }
  if (draftQueue.length && !draftOpen && !animating() && phase === "aim") openDraft(draftQueue.shift());
  updateFx(dt * timeScale());
  if (slowT > 0) slowT = Math.max(0, slowT - dt);
  shake = Math.max(0, shake - dt * 3.2); flashA = Math.max(0, flashA - dt * 1.6);
  render();
  updatePanel(now);
  updateFireBtn();
  requestAnimationFrame(frame);
}
resize();
syncUI();
newGame();
renderBests();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
requestAnimationFrame(frame);
})();
</script>
